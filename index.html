    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-glass: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Painel de Controlo Desktop */
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--bg-glass);
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.22);
            width: 320px;
            max-width: calc(100vw - 30px);
            backdrop-filter: blur(6px);
            transition: max-height 0.3s ease, transform 0.3s ease;
        }

        .panel-header-mobile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .control-panel h1 {
            font-size: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toggle-filtros {
            display: none;
            background: #eef2f5;
            border: 1px solid #ccd1d9;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-color);
            cursor: pointer;
        }

        .control-panel p.subtitle {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        .filter-group {
            margin-bottom: 8px;
        }

        .filter-group label {
            display: block;
            font-size: 11.5px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #444;
        }

        .filter-group select {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 12.5px;
            color: #222;
        }

        /* Botão Repor Filtros */
        .btn-limpar-filtros {
            width: 100%;
            margin-top: 4px;
            margin-bottom: 6px;
            padding: 6px;
            background: #ecf0f1;
            color: var(--primary-color);
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-limpar-filtros:hover {
            background: #bdc3c7;
            color: #1a252f;
        }

        .stats {
            font-size: 11px;
            color: #555;
            margin-top: 8px;
            border-top: 1px solid #eee;
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* Legenda de Cores */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #eee;
            font-size: 10.5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Ecrã de Carregamento */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader h2 {
            font-size: 17px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        #loader p {
            font-size: 12px;
            color: #666;
        }

        /* Janelas Popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .leaflet-popup-content {
            margin: 0;
            line-height: 1.4;
            width: 290px !important;
            max-height: 400px;
            overflow-y: auto;
        }

        .popup-header {
            background: var(--primary-color);
            color: white;
            padding: 9px 12px;
            font-weight: bold;
            font-size: 12.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-badge {

            border-radius: 4px;

            font-weight: bold;

        .badge-alminhas { background: #2980b9; color: white; }
        .badge-nicho { background: #27ae60; color: white; }
        .badge-cruz { background: #c0392b; color: white; }
        .badge-nicho-cruz { background: #8e44ad; color: white; }
        .badge-outro { background: #7f8c8d; color: white; }

        .popup-body {
            padding: 10px 12px;
            font-size: 11.5px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 170px;
            background: #1a1a1a;
            margin-bottom: 8px;
            border-radius: 6px;
            overflow: hidden;
        }

        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .carousel-img.active {
            display: block;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.55);
            color: white;
            border: none;
            cursor: pointer;
            padding: 6px 9px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 10;
        }

        .carousel-btn.prev { left: 4px; }
        .carousel-btn.next { right: 4px; }
        
        .carousel-counter {
            position: absolute;
            bottom: 4px;
            right: 6px;
            background: rgba(0,0,0,0.65);
            color: white;
            font-size: 9.5px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .popup-row {
            margin-bottom: 5px;
        }

        .popup-row strong {
            color: #444;
        }

        .popup-description {
            font-style: italic;
            color: #555;
            background: #f9f9f9;
            padding: 6px;
            border-left: 3px solid #ccc;
            margin: 6px 0;
            max-height: 80px;
            overflow-y: auto;
        }

        .popup-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-ficha {
            flex: 1;
            text-align: center;
            background: #e74c3c;
            color: white !important;
            text-decoration: none;
            padding: 7px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }

        .btn-gps {
            text-align: center;
            background: #34495e;
            color: white !important;
            text-decoration: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }

        /* ========================================================== */
        /* OTIMIZAÇÃO ESPECÍFICA PARA DISPOSITIVOS MÓVEIS (SMARTPHONES) */
        /* ========================================================== */
        @media (max-width: 640px) {
            .control-panel {
                top: auto;
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                max-width: 100%;
                border-radius: 14px 14px 0 0;
                padding: 10px 14px;
                box-shadow: 0 -3px 15px rgba(0,0,0,0.25);
            }

            .panel-header-mobile {
                padding-bottom: 2px;
            }

            .control-panel h1 {
                font-size: 13.5px;
            }

            .control-panel p.subtitle {
                display: none;
            }

            .btn-toggle-filtros {
                display: block;
            }

            .panel-corpo {
                display: none;
                margin-top: 8px;
            }

            .control-panel.expandido .panel-corpo {

            }

            .filter-group {
                margin-bottom: 6px;
            }

            .filter-group label {
                font-size: 11px;

            }

            .filter-group select {
                padding: 6px;
                font-size: 12px;
            }

            .stats {
                margin-top: 6px;
                padding-top: 5px;
                font-size: 10.5px;
            }

            .legend {
                font-size: 9.5px;
                gap: 6px;
                margin-top: 5px;
                padding-top: 5px;
            }

            .leaflet-bottom {
                bottom: 50px;
            }
        }
    </style>
</head>
<body>

    <div class="control-panel" id="painel-filtros">

    <div id="map"></div>

    <!-- Leaflet & Clustering JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // ====================================================================
        // LINK PUBLICADO EM CSV DA ABA DISTRITO DO GOOGLE SHEETS
        // ====================================================================
        const CSV_BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdIHTs9OSFutV7_VVJftFnusa-PFXrFRlklASBc1kmqbjbJDRgBccUJuiYwhLHPGEJW-fli0PY8Exw/pub?gid=1728241245&single=true&output=csv";

        // Alternância do painel de filtros em ecrãs móveis
        const painelFiltros = document.getElementById('painel-filtros');
        const btnToggle = document.getElementById('btn-toggle');
        const cabecalhoMobile = document.getElementById('cabecalho-mobile');

        function alternarFiltrosMobile() {
            if (window.innerWidth <= 640) {
                painelFiltros.classList.toggle('expandido');
                const estaExpandido = painelFiltros.classList.contains('expandido');
                btnToggle.textContent = estaExpandido ? '✕ Fechar' : '⚙️ Filtros ▾';
            }
        }

        btnToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            alternarFiltrosMobile();
        });

        cabecalhoMobile.addEventListener('click', () => {
            alternarFiltrosMobile();
        });

        function extrairIdDrive(url) {
            if (!url) return "";
            let limpo = url.trim();
            const matchIdParam = limpo.match(/[?&]id=([-\w]{25,})/);
            if (matchIdParam) return matchIdParam[1];
            const matchIdPath = limpo.match(/\/d\/([-\w]{25,})/);
            if (matchIdPath) return matchIdPath[1];
            const matchGeral = limpo.match(/[-\w]{25,}/);
            return matchGeral ? matchGeral[0] : "";
        }

        function normalizarLinkFotoDrive(url) {
            if (!url) return "";
            const fileId = extrairIdDrive(url);
            if (fileId) {
                return `https://lh3.googleusercontent.com/d/${fileId}=w1000`;
            }
            return url.trim();
        }

        const map = L.map('map', {
            zoomControl: true,
            preferCanvas: true
        }).setView([41.15, -8.35], 8);

        const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps'
        }).addTo(map);

        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps Satellite'
        });

        const googleTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps Terrain'
        });

        const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        });

        const baseLayers = {
            "Mapa de Ruas (Google)": googleStreets,
            "Satélite com Nomes (Google Híbrido)": googleHybrid,
            "Mapa de Relevo (Google Terreno)": googleTerrain,
            "Satélite Puro (ESRI)": satLayer
        };
        L.control.layers(baseLayers, null, { position: 'topleft' }).addTo(map);

        // ====================================================================
        // OTIMIZAÇÃO 1: CLUSTER COM CHUNKED LOADING (NÃO BLOQUEIA O ECRÃ)
        // ====================================================================
        const markersCluster = L.markerClusterGroup({
            chunkedLoading: true,
            chunkInterval: 100,
            chunkDelay: 25,
            maxClusterRadius: 45,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        });
        map.addLayer(markersCluster);

        // ====================================================================
        // CONTROLO DE POPUP ABERTO (IMPEDE QUE O AUTOPAN FECHE O POPUP)
        // ====================================================================
        let popupAberto = false;
        let movimentoPendente = false;

        map.on('popupopen', () => {
            popupAberto = true;
        });

        map.on('popupclose', () => {
            popupAberto = false;
            if (movimentoPendente) {
                movimentoPendente = false;
                atualizarMarcadoresNaJanela();
            }
        });

        // ====================================================================
        // OTIMIZAÇÃO 2: CACHE DE ÍCONES POR TIPOLOGIA (EVITA CRIAR 7000 DIVS)
        // ====================================================================
        const ICONES_CACHE = {};
        function obterIcone(tipologia) {
            let tipoNorm = (tipologia || "").trim().toLowerCase();
            let chave = "outro";
            let cor = "#7f8c8d";

            if (tipoNorm.includes("alminha")) {
                chave = "alminha";
                cor = "#2980b9";
            } else if (tipoNorm.includes("nicho-cruz") || tipoNorm.includes("nicho/cruz")) {
                chave = "nicho-cruz";
                cor = "#8e44ad";
            } else if (tipoNorm.includes("nicho")) {
                chave = "nicho";
                cor = "#27ae60";
            } else if (tipoNorm.includes("cruz")) {
                chave = "cruz";
                cor = "#c0392b";
            }

            if (!ICONES_CACHE[chave]) {
                ICONES_CACHE[chave] = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: ${cor}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.6);"></div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });
            }
            return ICONES_CACHE[chave];
        }

        let todosDadosGlobais = [];
        let dadosFiltradosAtuais = [];
        let totalFotosFiltradas = 0;

        function iniciarCarregamentoDados() {
            const urlSemCache = CSV_BASE_URL + "&t=" + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: false,
                skipEmptyLines: true,
                complete: function(resDistrito) {
                    processarDadosCompletos(resDistrito.data);
                },
                error: function(err) {
                    document.getElementById('loader').innerHTML = `<h3 style="color:#c0392b;">Erro ao carregar aba DISTRITO</h3><p>Verifique se publicou na Web como CSV.</p>`;
                }
            });
        }

        function processarDadosCompletos(linhasCsv) {
            todosDadosGlobais = [];
            const concelhosContagem = {};

            let idxFoto = 20;
            let idxFicha = 21;
            if (linhasCsv.length > 0) {
                const cabecalho = linhasCsv[0];
                for (let c = 0; c < cabecalho.length; c++) {
                    const nomeCol = String(cabecalho[c] || "").trim().toLowerCase();
                    if (nomeCol.includes("foto") || nomeCol.includes("imagem")) idxFoto = c;
                    if (nomeCol.includes("ficha") || nomeCol.includes("pdf") || nomeCol.includes("doc")) idxFicha = c;
                }
            }

            for (let i = 0; i < linhasCsv.length; i++) {
                const r = linhasCsv[i];
                if (!r || r.length < 9) continue;

                const latStr = String(r[7] || "").trim().replace(',', '.');
                const lonStr = String(r[8] || "").trim().replace(',', '.');
                const lat = parseFloat(latStr);
                const lon = parseFloat(lonStr);

                if (isNaN(lat) || isNaN(lon)) continue;

                const id           = String(r[0] || "").trim();
                const lugar        = String(r[1] || "").trim();
                const freguesia    = String(r[2] || "").trim();
                const concelho     = String(r[3] || "").trim();
                const distrito     = String(r[4] || "").trim();
                const painel       = String(r[5] || "").trim();
                const cronologia   = String(r[6] || "").trim();
                const descricao    = String(r[9] || "").trim();
                const autor        = String(r[10] || "").trim();
                const esmolas      = String(r[11] || "").trim();
                const protecao     = String(r[12] || "").trim();
                const altura       = String(r[13] || "").trim();
                const largura      = String(r
