<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRP - Património Religioso Popular</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- PapaParse para ler CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-glass: rgba(255, 255, 255, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Painel de Controlo Superior / Filtros */
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--bg-glass);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 320px;
            max-width: calc(100vw - 30px);
            backdrop-filter: blur(5px);
        }

        .control-panel h1 {
            font-size: 15px;
            color: var(--primary-color);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .control-panel p.subtitle {
            font-size: 11px;
            color: #666;
            margin-bottom: 12px;
        }

        .filter-group {
            margin-bottom: 10px;
        }

        .filter-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #444;
        }

        .filter-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 13px;
        }

        .stats {
            font-size: 11px;
            color: #555;
            margin-top: 10px;
            border-top: 1px solid #eee;
            padding-top: 8px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* Legenda de Cores */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 11px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Ecrã de Carregamento */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader h2 {
            font-size: 18px;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        #loader p {
            font-size: 13px;
            color: #666;
        }

        /* Estilo personalizado das Janelas Popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .leaflet-popup-content {
            margin: 0;
            line-height: 1.4;
            width: 300px !important;
            max-height: 420px;
            overflow-y: auto;
        }

        .popup-header {
            background: var(--primary-color);
            color: white;
            padding: 10px 14px;
            font-weight: bold;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Cores de Tipologia para Badges e Marcadores */
        .badge-alminhas { background: #2980b9; color: white; }
        .badge-nicho { background: #27ae60; color: white; }
        .badge-cruz { background: #c0392b; color: white; }
        .badge-nicho-cruz { background: #8e44ad; color: white; }
        .badge-outro { background: #7f8c8d; color: white; }

        .popup-body {
            padding: 12px;
            font-size: 12px;
        }

        /* Carrossel de Fotos */
        .carousel-container {
            position: relative;
            width: 100%;
            height: 180px;
            background: #1a1a1a;
            margin-bottom: 10px;
            border-radius: 6px;
            overflow: hidden;
        }

        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .carousel-img.active {
            display: block;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            cursor: pointer;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 10;
        }

        .carousel-btn.prev { left: 5px; }
        .carousel-btn.next { right: 5px; }
        
        .carousel-counter {
            position: absolute;
            bottom: 5px;
            right: 8px;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 10px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .popup-row {
            margin-bottom: 6px;
        }

        .popup-row strong {
            color: #444;
        }

        .popup-description {
            font-style: italic;
            color: #555;
            background: #f9f9f9;
            padding: 6px;
            border-left: 3px solid #ccc;
            margin: 8px 0;
            max-height: 90px;
            overflow-y: auto;
        }

        .popup-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
        }

        .btn-ficha {
            flex: 1;
            text-align: center;
            background: #e74c3c;
            color: white !important;
            text-decoration: none;
            padding: 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            transition: background 0.2s;
        }

        .btn-ficha:hover {
            background: #c0392b;
        }

        .btn-gps {
            text-align: center;
            background: #34495e;
            color: white !important;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            transition: background 0.2s;
        }

        .btn-gps:hover {
            background: #2c3e50;
        }

        @media (max-width: 600px) {
            .control-panel {
                top: auto;
                bottom: 15px;
                right: 10px;
                left: 10px;
                width: auto;
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2>A carregar base de dados do PRP...</h2>
        <p>A sincronizar registos e fotografias da aba DISTRITO</p>
    </div>

    <div class="control-panel">
        <h1>🏛️ Alminhas Digital</h1>
        <p class="subtitle">Património Religioso Popular</p>
        
        <div class="filter-group">
            <label for="select-concelho">Filtrar por Concelho:</label>
            <select id="select-concelho">
                <option value="TODOS">Todos os Concelhos</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="select-freguesia">Filtrar por Freguesia:</label>
            <select id="select-freguesia">
                <option value="TODOS">Todas as Freguesias</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="select-tipologia">Filtrar por Tipologia:</label>
            <select id="select-tipologia">
                <option value="TODOS">Todas as Tipologias</option>
                <option value="Alminhas">Alminhas</option>
                <option value="Nicho">Nicho</option>
                <option value="Cruz">Cruz</option>
                <option value="Nicho-Cruz">Nicho-Cruz</option>
            </select>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="legend-dot" style="background:#2980b9;"></span> Alminhas</div>
            <div class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span> Nicho</div>
            <div class="legend-item"><span class="legend-dot" style="background:#c0392b;"></span> Cruz</div>
            <div class="legend-item"><span class="legend-dot" style="background:#8e44ad;"></span> Nicho-Cruz</div>
        </div>

        <div class="stats">
            <span id="stat-total">A carregar registos...</span>
            <span id="stat-fotos"></span>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet & Clustering JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script>
        // ====================================================================
        // LINK PUBLICADO EM CSV DA ABA DISTRITO DO GOOGLE SHEETS (COM ANTI-CACHE)
        // ====================================================================
        const CSV_BASE_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdIHTs9OSFutV7_VVJftFnusa-PFXrFRlklASBc1kmqbjbJDRgBccUJuiYwhLHPGEJW-fli0PY8Exw/pub?gid=1728241245&single=true&output=csv";

        // Extrai o ID do ficheiro da Google Drive e gera o link direto de imagem mais estável
        function extrairIdDrive(url) {
            if (!url) return "";
            let limpo = url.trim();
            const matchIdParam = limpo.match(/[?&]id=([-\w]{25,})/);
            if (matchIdParam) return matchIdParam[1];
            const matchIdPath = limpo.match(/\/d\/([-\w]{25,})/);
            if (matchIdPath) return matchIdPath[1];
            const matchGeral = limpo.match(/[-\w]{25,}/);
            return matchGeral ? matchGeral[0] : "";
        }

        function normalizarLinkFotoDrive(url) {
            if (!url) return "";
            const fileId = extrairIdDrive(url);
            if (fileId) {
                return `https://lh3.googleusercontent.com/d/${fileId}=w1000`;
            }
            return url.trim();
        }

        // Inicialização do Mapa centrado em Portugal
        const map = L.map('map', {
            zoomControl: true
        }).setView([41.15, -8.35], 8);

        // Camadas de Fundo - "Mapa de Ruas (Google)" definido por defeito
        const googleStreets = L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps'
        }).addTo(map);

        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps Satellite'
        });

        const googleTerrain = L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps Terrain'
        });

        const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            attribution: 'Tiles © Esri'
        });

        const baseLayers = {
            "Mapa de Ruas (Google)": googleStreets,
            "Satélite com Nomes (Google Híbrido)": googleHybrid,
            "Mapa de Relevo (Google Terreno)": googleTerrain,
            "Satélite Puro (ESRI)": satLayer
        };
        L.control.layers(baseLayers, null, { position: 'topleft' }).addTo(map);

        // Agrupador de Clusters de Marcadores
        const markersCluster = L.markerClusterGroup({
            maxClusterRadius: 45,
            spiderfyOnMaxZoom: true,
            showCoverageOnHover: false
        });
        map.addLayer(markersCluster);

        // Ícones personalizados por Tipologia
        function criarIcone(tipologia) {
            let cor = "#7f8c8d"; // Cinzento por defeito
            let tipoNorm = (tipologia || "").trim().toLowerCase();

            if (tipoNorm.includes("alminha")) cor = "#2980b9";      // Azul
            else if (tipoNorm.includes("nicho-cruz")) cor = "#8e44ad"; // Roxo
            else if (tipoNorm.includes("nicho")) cor = "#27ae60";      // Verde
            else if (tipoNorm.includes("cruz")) cor = "#c0392b";       // Vermelho

            return L.divIcon({
                className: 'custom-pin',
                html: `<div style="background-color: ${cor}; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 4px rgba(0,0,0,0.6);"></div>`,
                iconSize: [18, 18],
                iconAnchor: [9, 9]
            });
        }

        let todosDadosGlobais = [];

        function iniciarCarregamentoDados() {
            // Força o Google Sheets e o navegador a entregarem a versão mais recente sem cache
            const urlSemCache = CSV_BASE_URL + "&t=" + new Date().getTime();

            Papa.parse(urlSemCache, {
                download: true,
                header: false,
                skipEmptyLines: true,
                complete: function(resDistrito) {
                    processarDadosCompletos(resDistrito.data);
                },
                error: function(err) {
                    document.getElementById('loader').innerHTML = `<h3 style="color:#c0392b;">Erro ao carregar aba DISTRITO</h3><p>Verifique se publicou na Web como CSV.</p>`;
                }
            });
        }

        function processarDadosCompletos(linhasCsv) {
            todosDadosGlobais = [];
            const concelhosSet = new Set();

            // Descobre dinamicamente em que coluna está Foto e Ficha pelo cabeçalho (Linha 0),
            // garantindo por defeito Coluna U (20) e Coluna V (21)
            let idxFoto = 20;
            let idxFicha = 21;
            if (linhasCsv.length > 0) {
                const cabecalho = linhasCsv[0];
                for (let c = 0; c < cabecalho.length; c++) {
                    const nomeCol = String(cabecalho[c] || "").trim().toLowerCase();
                    if (nomeCol.includes("foto") || nomeCol.includes("imagem")) idxFoto = c;
                    if (nomeCol.includes("ficha") || nomeCol.includes("pdf") || nomeCol.includes("doc")) idxFicha = c;
                }
            }

            for (let i = 0; i < linhasCsv.length; i++) {
                const r = linhasCsv[i];
                if (!r || r.length < 9) continue;

                // Mapeamento das colunas do Google Sheets (A até V)
                const id           = String(r[0] || "").trim(); // A: ID
                const lugar        = String(r[1] || "").trim(); // B: Lugar
                const freguesia    = String(r[2] || "").trim(); // C: Freguesia
                const concelho     = String(r[3] || "").trim(); // D: Concelho
                const distrito     = String(r[4] || "").trim(); // E: Distrito
                const painel       = String(r[5] || "").trim(); // F: Painel
                const cronologia   = String(r[6] || "").trim(); // G: Cronologia
                const latStr       = String(r[7] || "").trim().replace(',', '.'); // H: Latitude
                const lonStr       = String(r[8] || "").trim().replace(',', '.'); // I: Longitude
                const descricao    = String(r[9] || "").trim(); // J: Descrição
                const autor        = String(r[10] || "").trim(); // K: Autor
                const esmolas      = String(r[11] || "").trim(); // L: Esmolas
                const protecao     = String(r[12] || "").trim(); // M: Proteção
                const altura       = String(r[13] || "").trim(); // N: Altura
                const largura      = String(r[14] || "").trim(); // O: Largura
                const profundidade = String(r[15] || "").trim(); // P: Profundidade
                const tipologia    = String(r[16] || "").trim(); // Q: Tipologia
                const dataAtualiz  = String(r[17] || "").trim(); // R: Data
                const referencias  = String(r[18] || "").trim(); // S: Referências
                const obs          = String(r[19] || "").trim(); // T: Obs
                
                let foto  = String(r[idxFoto] || "").trim();  // U: Foto (índice 20)
                let ficha = String(r[idxFicha] || "").trim(); // V: Ficha Técnica (índice 21)

                const lat = parseFloat(latStr);
                const lon = parseFloat(lonStr);

                if (!isNaN(lat) && !isNaN(lon)) {
                    if (concelho) concelhosSet.add(concelho);

                    todosDadosGlobais.push({
                        id, lugar, freguesia, concelho, distrito, painel, cronologia,
                        lat, lon, descricao, autor, esmolas, protecao,
                        altura, largura, profundidade, tipologia, dataAtualiz,
                        referencias, obs,
                        foto,
                        ficha
                    });
                }
            }

            // Preenche o seletor de concelhos alfabeticamente
            const selectConcelho = document.getElementById('select-concelho');
            selectConcelho.innerHTML = '<option value="TODOS">Todos os Concelhos</option>';
            Array.from(concelhosSet).sort((a, b) => a.localeCompare(b, 'pt')).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                selectConcelho.appendChild(opt);
            });

            // Permite abrir diretamente um concelho via URL (ex: index.html?concelho=Amares)
            const urlParams = new URLSearchParams(window.location.search);
            const concelhoUrl = urlParams.get('concelho');
            if (concelhoUrl) {
                for (let i = 0; i < selectConcelho.options.length; i++) {
                    if (selectConcelho.options[i].value.toLowerCase() === concelhoUrl.toLowerCase()) {
                        selectConcelho.selectedIndex = i;
                        break;
                    }
                }
            }

            // Atualiza a lista de freguesias de acordo com a
