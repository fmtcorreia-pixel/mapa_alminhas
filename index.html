<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PRP - Património Religioso Popular</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Leaflet MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <!-- PapaParse para ler CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --bg-glass: rgba(255, 255, 255, 0.96);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #333;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100vh;
            z-index: 1;
            touch-action: manipulation;
        }

        /* Painel de Controlo Desktop */
        .control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: var(--bg-glass);
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.22);
            width: 320px;
            max-width: calc(100vw - 30px);
            backdrop-filter: blur(6px);
            transition: max-height 0.3s ease, transform 0.3s ease;
        }

        .panel-header-mobile {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .control-panel h1 {
            font-size: 15px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-toggle-filtros {
            display: none;
            background: #eef2f5;
            border: 1px solid #ccd1d9;
            border-radius: 5px;
            padding: 3px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--primary-color);
            cursor: pointer;
        }

        .control-panel p.subtitle {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
            margin-bottom: 10px;
        }

        .filter-group {
            margin-bottom: 8px;
        }

        .filter-group label {
            display: block;
            font-size: 11.5px;
            font-weight: bold;
            margin-bottom: 3px;
            color: #444;
        }

        .filter-group select {
            width: 100%;
            padding: 7px 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #fff;
            font-size: 12.5px;
            color: #222;
        }

        /* Botão Repor Filtros */
        .btn-limpar-filtros {
            width: 100%;
            margin-top: 4px;
            margin-bottom: 6px;
            padding: 6px;
            background: #ecf0f1;
            color: var(--primary-color);
            border: 1px solid #bdc3c7;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-limpar-filtros:hover {
            background: #bdc3c7;
            color: #1a252f;
        }

        .stats {
            font-size: 11px;
            color: #555;
            margin-top: 8px;
            border-top: 1px solid #eee;
            padding-top: 6px;
            display: flex;
            justify-content: space-between;
            font-weight: 600;
        }

        /* Legenda de Cores */
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #eee;
            font-size: 10.5px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
        }

        /* Ecrã de Carregamento */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.95);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loader h2 {
            font-size: 17px;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        #loader p {
            font-size: 12px;
            color: #666;
        }

        /* Janelas Popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .leaflet-popup-content {
            margin: 0;
            line-height: 1.4;
            width: 290px !important;
            max-height: 400px;
            overflow-y: auto;
        }

        .popup-header {
            background: var(--primary-color);
            color: white;
            padding: 9px 12px;
            font-weight: bold;
            font-size: 12.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .popup-badge {
            font-size: 9.5px;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
        }

        .badge-alminhas { background: #2980b9; color: white; }
        .badge-nicho { background: #27ae60; color: white; }
        .badge-cruz { background: #c0392b; color: white; }
        .badge-nicho-cruz { background: #8e44ad; color: white; }
        .badge-outro { background: #7f8c8d; color: white; }

        .popup-body {
            padding: 10px 12px;
            font-size: 11.5px;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 170px;
            background: #1a1a1a;
            margin-bottom: 8px;
            border-radius: 6px;
            overflow: hidden;
        }

        .carousel-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .carousel-img.active {
            display: block;
        }

        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.55);
            color: white;
            border: none;
            cursor: pointer;
            padding: 6px 9px;
            font-size: 12px;
            border-radius: 4px;
            z-index: 10;
        }

        .carousel-btn.prev { left: 4px; }
        .carousel-btn.next { right: 4px; }
        
        .carousel-counter {
            position: absolute;
            bottom: 4px;
            right: 6px;
            background: rgba(0,0,0,0.65);
            color: white;
            font-size: 9.5px;
            padding: 2px 5px;
            border-radius: 3px;
        }

        .popup-row {
            margin-bottom: 5px;
        }

        .popup-row strong {
            color: #444;
        }

        .popup-description {
            font-style: italic;
            color: #555;
            background: #f9f9f9;
            padding: 6px;
            border-left: 3px solid #ccc;
            margin: 6px 0;
            max-height: 80px;
            overflow-y: auto;
        }

        .popup-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .btn-ficha {
            flex: 1;
            text-align: center;
            background: #e74c3c;
            color: white !important;
            text-decoration: none;
            padding: 7px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }

        .btn-gps {
            text-align: center;
            background: #34495e;
            color: white !important;
            text-decoration: none;
            padding: 7px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
        }

        /* ========================================================== */
        /* OTIMIZAÇÃO ESPECÍFICA PARA DISPOSITIVOS MÓVEIS (SMARTPHONES) */
        /* ========================================================== */
        @media (max-width: 640px) {
            .control-panel {
                top: auto;
                bottom: 0;
                right: 0;
                left: 0;
                width: 100%;
                max-width: 100%;
                border-radius: 14px 14px 0 0;
                padding: 10px 14px;
                box-shadow: 0 -3px 15px rgba(0,0,0,0.25);
            }

            .panel-header-mobile {
                padding-bottom: 2px;
            }

            .control-panel h1 {
                font-size: 13.5px;
            }

            .control-panel p.subtitle {
                display: none;
            }

            .btn-toggle-filtros {
                display: block;
            }

            .panel-corpo {
                display: none;
                margin-top: 8px;
            }

            .control-panel.expandido .panel-corpo {
                display: block;
            }

            .filter-group {
                margin-bottom: 6px;
            }

            .filter-group label {
                font-size: 11px;
                margin-bottom: 2px;
            }

            .filter-group select {
                padding: 6px;
                font-size: 12px;
            }

            .stats {
                margin-top: 6px;
                padding-top: 5px;
                font-size: 10.5px;
            }

            .legend {
                font-size: 9.5px;
                gap: 6px;
                margin-top: 5px;
                padding-top: 5px;
            }

            .leaflet-bottom {
                bottom: 50px;
            }
        }
    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <h2>A carregar base de dados do PRP...</h2>
        <p>A sincronizar registos e fotografias da aba DISTRITO</p>
    </div>

    <div class="control-panel" id="painel-filtros">
        <div class="panel-header-mobile" id="cabecalho-mobile">
            <h1>🏛️ Alminhas Digital</h1>
            <button type="button" class="btn-toggle-filtros" id="btn-toggle">⚙️ Filtros ▾</button>
        </div>
        <p class="subtitle">Património Religioso Popular</p>

        <!-- Corpo recolhível em mobile -->
        <div class="panel-corpo" id="panel-corpo">
            <div class="filter-group">
                <label for="select-concelho">Filtrar por Concelho:</label>
                <select id="select-concelho">
                    <option value="TODOS">Todos os Concelhos</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-freguesia">Filtrar por Freguesia:</label>
                <select id="select-freguesia">
                    <option value="TODOS">Todas as Freguesias</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="select-tipologia">Filtrar por Tipologia:</label>
                <select id="select-tipologia">
                    <option value="TODOS">Todas as Tipologias</option>
                    <option value="Alminhas">Alminhas</option>
                    <option value="Nicho">Nicho</option>
                    <option value="Cruz">Cruz</option>
                    <option value="Nicho-Cruz">Nicho-Cruz</option>
                </select>
            </div>

            <button id="btn-limpar" class="btn-limpar-filtros" type="button">🔄 Repor Filtros</button>

            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background:#2980b9;"></span> Alminhas</div>
                <div class="legend-item"><span class="legend-dot" style="background:#27ae60;"></span> Nicho</div>
                <div class="legend-item"><span class="legend-dot" style="background:#c0392b;"></span> Cruz</div>
                <div class="legend-item"><span class="legend-dot" style="background:#8e44ad;"></span> Nicho-Cruz</div>
            </div>
        </div>

        <div class="stats">
            <span id="stat-total">A carregar registos...</span>
            <span id="stat-fotos"></span>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet & Clustering JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
