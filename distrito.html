<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo de Distrito - PRP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f5;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        .label-concelho {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            font-size: 9.5px;
            font-weight: 700;
            color: #2c3e50;
            text-transform: uppercase;
            text-align: center;
            text-shadow: 
                -1.2px -1.2px 0 rgba(255,255,255,0.9),  
                 1.2px -1.2px 0 rgba(255,255,255,0.9),
                -1.2px  1.2px 0 rgba(255,255,255,0.9),
                 1.2px  1.2px 0 rgba(255,255,255,0.9);
            pointer-events: none;
            white-space: nowrap;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            color: #2c3e50;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <div id="status">A carregar mapa com cartografia Google...</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const DISTRITO_ALVO = params.get('d') || params.get('distrito') || "Aveiro";

        const URL_MAPA_CONCELHO = "https://fmtcorreia-pixel.github.io/mapa_alminhas/?concelho=";
        const CSV_DISTRITO_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdIHTs9OSFutV7_VVJftFnusa-PFXrFRlklASBc1kmqbjbJDRgBccUJuiYwhLHPGEJW-fli0PY8Exw/pub?gid=1728241245&single=true&output=csv";

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            dragging: true,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            zoomSnap: 0.1
        });

        // Utilização dos mapas da Google (mesma camada do mapa principal)
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps'
        }).addTo(map);

        function normalizar(str) {
            return String(str || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[-_]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        const MAPA_DISTRITOS = {
            "aveiro": [
                "Águeda", "Albergaria-a-Velha", "Anadia", "Arouca", "Aveiro",
                "Castelo de Paiva", "Espinho", "Estarreja", "Ílhavo", "Mealhada",
                "Murtosa", "Oliveira de Azeméis", "Oliveira do Bairro", "Ovar",
                "Santa Maria da Feira", "São João da Madeira", "Sever do Vouga",
                "Vagos", "Vale de Cambra"
            ],
            "porto": [
                "Amarante", "Baião", "Felgueiras", "Gondomar", "Lousada", "Maia",
                "Marco de Canaveses", "Matosinhos", "Paços de Ferreira", "Paredes",
                "Penafiel", "Porto", "Póvoa de Varzim", "Santo Tirso", "Trofa",
                "Valongo", "Vila do Conde", "Vila Nova de Gaia"
            ],
            "braga": [
                "Amares", "Barcelos", "Braga", "Cabeceiras de Basto", "Celorico de Basto",
                "Esposende", "Fafe", "Guimarães", "Póvoa de Lanhoso", "Terras de Bouro",
                "Vieira do Minho", "Vila Nova de Famalicão", "Vila Verde", "Vizela"
            ],
            "viseu": [
                "Armamar", "Carregal do Sal", "Castro Daire", "Cinfães", "Lamego",
                "Mangualde", "Moimenta da Beira", "Mortágua", "Nelas", "Oliveira de Frades",
                "Penalva do Castelo", "Penedono", "Resende", "Santa Comba Dão",
                "São João da Pesqueira", "São Pedro do Sul", "Sátão", "Sernancelhe",
                "Tabuaço", "Tarouca", "Tondela", "Vila Nova de Paiva", "Viseu", "Vouzela"
            ],
            "viana do castelo": [
                "Arcos de Valdevez", "Caminha", "Melgaço", "Monção", "Paredes de Coura",
                "Ponte da Barca", "Ponte de Lima", "Valença", "Viana do Castelo", "Vila Nova de Cerveira"
            ]
        };

        const ATIVOS_DEFEITO = [
            "Arouca", "Castelo de Paiva", "Espinho", "Oliveira de Azeméis",
            "Ovar", "Santa Maria da Feira", "São João da Madeira",
            "Sever do Vouga", "Vale de Cambra"
        ].map(normalizar);

        const FONTES_GEOJSON = [
            "https://raw.githubusercontent.com/nmota/caop_geojson/master/concelhos.geojson",
            "https://cdn.jsdelivr.net/gh/nmota/caop_geojson@master/concelhos.geojson",
            "https://raw.githubusercontent.com/forgotten/portugal-geojson/master/concelhos.geojson"
        ];

        async function obterGeoJSON() {
            for (const url of FONTES_GEOJSON) {
                try {
                    const r = await fetch(url);
                    if (!r.ok) continue;
                    const data = await r.json();
                    if (data && data.features && data.features.length > 50) return data;
                } catch (e) {}
            }
            return null;
        }

        function obterConcelhosComRegistos() {
            return new Promise(resolve => {
                const ativos = new Set(ATIVOS_DEFEITO);
                Papa.parse(CSV_DISTRITO_URL, {
                    download: true,
                    header: false,
                    skipEmptyLines: true,
                    complete: function(res) {
                        if (res && res.data) {
                            for (let i = 1; i < res.data.length; i++) {
                                const conc = normalizar(res.data[i][3]);
                                if (conc) ativos.add(conc);
                            }
                        }
                        resolve(ativos);
                    },
                    error: function() { resolve(ativos); }
                });
            });
        }

        function nomeConcelho(p) {
            return p.Concelho || p.CONCELHO || p.concelho || p.Municipio || p.MUNICIPIO || p.NAME_2 || p.name || "";
        }

        function nomeDistrito(p) {
            return p.Distrito || p.DISTRITO || p.distrito || p.NAME_1 || p.Ilha || "";
        }

        Promise.all([obterGeoJSON(), obterConcelhosComRegistos()]).then(([geojson, concelhosAtivos]) => {
            const statusEl = document.getElementById('status');
            if (!geojson) {
                statusEl.textContent = "Erro ao carregar limites.";
                return;
            }

            const distNorm = normalizar(DISTRITO_ALVO);
            const listaConcelhos = (MAPA_DISTRITOS[distNorm] || []).map(normalizar);

            const features = geojson.features.filter(f => {
                const c = normalizar(nomeConcelho(f.properties));
                const d = normalizar(nomeDistrito(f.properties));
                if (listaConcelhos.length > 0 && listaConcelhos.includes(c)) return true;
                return d === distNorm;
            });

            if (features.length === 0) {
                statusEl.textContent = "Distrito não encontrado: " + DISTRITO_ALVO;
                return;
            }

            statusEl.style.display = 'none';

            function estilo(feature) {
                const nome = nomeConcelho(feature.properties);
                const ativo = concelhosAtivos.has(normalizar(nome));
                return {
                    fillColor: ativo ? "#8ec396" : "#d8ecd9",
                    weight: 1.5,
                    opacity: 1,
                    color: "#4a5d52",
                    fillOpacity: 0.75
                };
            }

            const camada = L.geoJSON({ type: "FeatureCollection", features: features }, {
                style: estilo,
                onEachFeature: function(feature, layer) {
                    const nome = nomeConcelho(feature.properties);

                    layer.bindTooltip(nome, {
                        permanent: true,
                        direction: "center",
                        className: "label-concelho"
                    });

                    layer.on('mouseover', function(e) {
                        const l = e.target;
                        l.setStyle({
                            fillColor: "#388e3c",
                            weight: 2.5,
                            color: "#1b5e20",
                            fillOpacity: 0.85
                        });
                        l.bringToFront();
                        document.getElementById('map').style.cursor = 'pointer';
                    });

                    layer.on('mouseout', function(e) {
                        camada.resetStyle(e.target);
                        document.getElementById('map').style.cursor = 'default';
                    });

                    layer.on('click', function() {
                        window.open(URL_MAPA_CONCELHO + encodeURIComponent(nome), '_blank');
                    });
                }
            }).addTo(map);

            map.fitBounds(camada.getBounds(), { padding: [20, 20] });
            window.addEventListener('resize', () => {
                map.fitBounds(camada.getBounds(), { padding: [20, 20] });
            });
        });
    </script>
</body>
</html>
