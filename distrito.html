<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo de Distrito - PRP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f4f6f5;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
        }
        /* Caixa de Aviso personalizada (Popup de alerta) */
        #modal-aviso {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: #2c3e50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(0,0,0,0.25);
            z-index: 9999;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            text-align: center;
        }
        #modal-aviso.mostrar {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="modal-aviso">Ainda não existe mapa para este concelho.</div>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const DISTRITO_ALVO = (params.get('d') || params.get('distrito') || "Aveiro").trim();

        const URL_MAPA_CONCELHO = "https://fmtcorreia-pixel.github.io/mapa_alminhas/?concelho=";
        const CSV_DISTRITO_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdIHTs9OSFutV7_VVJftFnusa-PFXrFRlklASBc1kmqbjbJDRgBccUJuiYwhLHPGEJW-fli0PY8Exw/pub?gid=1728241245&single=true&output=csv";

        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            dragging: true,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            zoomSnap: 0.1
        });

        // Fundo do Google Maps
        L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps'
        }).addTo(map);

        function normalizar(str) {
            return String(str || "")
                .toLowerCase()
                .normalize("NFD")
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/[-_]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        // Lista completa dos concelhos do distrito de Aveiro com respetivas coordenadas
        const CONCELHOS_AVEIRO = [
            { nome: "Águeda", coords: [40.575, -8.447] },
            { nome: "Albergaria-a-Velha", coords: [40.704, -8.483] },
            { nome: "Anadia", coords: [40.441, -8.435] },
            { nome: "Arouca", coords: [40.927, -8.243] },
            { nome: "Aveiro", coords: [40.640, -8.653] },
            { nome: "Castelo de Paiva", coords: [41.047, -8.292] },
            { nome: "Espinho", coords: [41.004, -8.641] },
            { nome: "Estarreja", coords: [40.758, -8.571] },
            { nome: "Ílhavo", coords: [40.601, -8.667] },
            { nome: "Mealhada", coords: [40.378, -8.448] },
            { nome: "Murtosa", coords: [40.738, -8.632] },
            { nome: "Oliveira de Azeméis", coords: [40.840, -8.477] },
            { nome: "Oliveira do Bairro", coords: [40.510, -8.488] },
            { nome: "Ovar", coords: [40.864, -8.626] },
            { nome: "Santa Maria da Feira", coords: [40.925, -8.545] },
            { nome: "São João da Madeira", coords: [40.903, -8.490] },
            { nome: "Sever do Vouga", coords: [40.735, -8.371] },
            { nome: "Vagos", coords: [40.547, -8.682] },
            { nome: "Vale de Cambra", coords: [40.848, -8.394] }
        ];

        function mostrarAviso() {
            const modal = document.getElementById('modal-aviso');
            modal.classList.add('mostrar');
            setTimeout(() => {
                modal.classList.remove('mostrar');
            }, 2500);
        }

        function obterConcelhosComRegistos() {
            return new Promise(resolve => {
                // Concelhos que têm mapas válidos atualmente
                const ativos = new Set([
                    "povoa de varzim", "vale de cambra"
                ]);
                Papa.parse(CSV_DISTRITO_URL, {
                    download: true,
                    header: false,
                    skipEmptyLines: true,
                    complete: function(res) {
                        if (res && res.data) {
                            for (let i = 1; i < res.data.length; i++) {
                                const conc = normalizar(res.data[i][3]);
                                if (conc) ativos.add(conc);
                            }
                        }
                        resolve(ativos);
                    },
                    error: function() { resolve(ativos); }
                });
            });
        }

        obterConcelhosComRegistos().then(concelhosAtivos => {
            const grupoMarcadores = [];

            CONCELHOS_AVEIRO.forEach(c => {
                const isAtivo = concelhosAtivos.has(normalizar(c.nome));
                
                // 1. Cor mais escura para os que têm mapa / 2. Cor mais clara para os que não têm
                const corFundo = isAtivo ? "#1b5e20" : "#a5d6a7"; // Verde escuro vs Verde claro suave
                const corTexto = isAtivo ? "#ffffff" : "#1b5e20";
                const pesoBorda = isAtivo ? "2px solid #ffffff" : "1px dashed #2e7d32";

                const icone = L.divIcon({
                    className: 'custom-concelho-pin',
                    html: `<div style="background-color: ${corFundo}; color: ${corTexto}; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; box-shadow: 0 3px 8px rgba(0,0,0,0.25); border: ${pesoBorda}; white-space: nowrap; text-align: center; cursor: pointer;">${c.nome}</div>`,
                    iconSize: [120, 30],
                    iconAnchor: [60, 15]
                });

                const marker = L.marker(c.coords, { icon: icone }).addTo(map);

                marker.on('click', function() {
                    if (isAtivo) {
                        // Abre o mapa do concelho
                        window.open(URL_MAPA_CONCELHO + encodeURIComponent(c.nome), '_blank');
                    } else {
                        // 3. Mostra a mensagem personalizada se não tiver mapa
                        mostrarAviso();
                    }
                });

                grupoMarcadores.push(c.coords);
            });

            if (grupoMarcadores.length > 0) {
                const bounds = L.latLngBounds(grupoMarcadores);
                map.fitBounds(bounds, { padding: [40, 40] });
            }
        });
    </script>
</body>
</html>
